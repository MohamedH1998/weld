name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "install.sh", "scripts/pin-release.sh", ".github/ISSUE_TEMPLATE/**"]
  push:
    branches: [main]
    # (words and the install script only: nothing CI builds or checks has changed)
    paths-ignore: ["**/*.md", "docs/**", "install.sh", "scripts/pin-release.sh", ".github/ISSUE_TEMPLATE/**"]

# a newer push to the same branch replaces a run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # the app itself, opened and used, on the dev build (no agent credentials: a mock agent stands in)
      - run: pnpm smoke
      # the Edit menu's keys while words are being written in a shape (Select All, Undo, Redo)
      - run: WELD_SEED=0 node scripts/shot.mjs out/keys test/keys.mjs
      # the conversation risen from the bar: scrolled, its words selected and copied
      - run: WELD_SEED=0 node scripts/shot.mjs out/reader test/reader.mjs
      # a drawing that plays, stepped through with its conversation picked too, stays its agent's to redraw
      - run: node scripts/shot.mjs out/moments test/moments.mjs
      # many pages open beside a conversation: weld look answers in good time, with every page in it
      - run: node scripts/shot.mjs out/looks test/looks.mjs
      # quitting ends the app, even when a step of quitting throws or never ends
      - run: node test/quit.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
