name: Release

# Builds, signs when set up, checks and drafts a release, when run by hand for a tag like v0.2.0 (matching package.json's
# version). Not on every tag push: install.sh pins the SHA-256 of the exact zip it installs, so a release is published
# from the build that was pinned (see CONTRIBUTING.md), and a second build of the same tag would not match it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - run: pnpm typecheck

      # Signing is set up with these repository secrets (all of them, or none for an ad-hoc signed build):
      #   MACOS_CERTIFICATE           base64 of a "Developer ID Application" .p12
      #   MACOS_CERTIFICATE_PASSWORD  its password
      #   APPLE_API_KEY_P8            the contents of an App Store Connect API key (.p8)
      #   APPLE_API_KEY_ID, APPLE_API_ISSUER
      - name: Signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # all five, or none: anything in between is a mistake, and stops the release
          n=0; for v in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            eval "[ -n \"\${$v:-}\" ]" && n=$((n + 1))
          done
          if [ "$n" -ne 0 ] && [ "$n" -ne 5 ]; then echo "Signing is half set up ($n of 5 secrets)"; exit 1; fi
          if [ "$n" -eq 0 ]; then echo "No signing secrets: the release will be ad-hoc signed"; exit 0; fi
          if [ -n "$MACOS_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"; pass="$(openssl rand -hex 16)"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
            if [ -z "$identity" ]; then echo "The certificate holds no Developer ID Application identity"; exit 1; fi
            echo "WELD_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/api-key.p8" >> "$GITHUB_ENV"
          fi
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      # builds, signs (or ad-hoc signs), notarizes when signed, and makes the DMG, zip and checksums
      - run: pnpm release

      # the app as people get it, out of the DMG, opened and used
      - run: scripts/smoke-release.sh "out/release/Weld-${GITHUB_REF_NAME#v}-arm64.dmg"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/release/*.dmg out/release/*.zip out/release/SHA256SUMS.txt --draft --generate-notes --title "Weld ${GITHUB_REF_NAME#v}"
